<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שירלי ופפה">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F8B4CC">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>שירלי לומדת עם פפה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one-screen kids' app. Top bar + full-height main. Big tap targets, single bright theme by choice. */
:root{
  --pink:#F8B4CC; --pink-deep:#E0528F; --pink-soft:#FDE3EC;
  --mud:#8B5A3C; --mud-soft:#E8D3BE;
  --sky:#CDEBFF; --sky-deep:#4FA8E0;
  --grass:#BFE8A0; --grass-deep:#4E9E34;
  --sun:#FFE27A; --sun-deep:#E0A800;
  --cream:#FFF9F3; --ink:#3B2733; --ink-soft:#7A6470;
  --ok:#43B55B; --ok-soft:#E3F7E7; --bad:#E34B4B; --white:#fff;
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(ellipse 140px 60px at 12% 6%, #fff 58%, transparent 60%),
  radial-gradient(ellipse 180px 70px at 85% 10%, #fff 58%, transparent 60%),
  linear-gradient(var(--sky) 0, var(--cream) 42%);
  color:var(--ink);font-family:var(--display);font-size:18px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--sky-deep);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 10px;gap:8px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex:none}
.top .title{flex:1;text-align:center;font-weight:600;font-size:20px;color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:56px;height:56px;border-radius:50%;background:var(--white);box-shadow:0 4px 0 rgba(59,39,51,.14);font-size:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .08s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,39,51,.14)}
.stars{display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 18px;border-radius:999px;background:var(--sun);font-weight:700;font-size:22px;box-shadow:0 4px 0 var(--sun-deep);font-variant-numeric:tabular-nums}

main{flex:1;min-height:0;display:flex;flex-direction:column}
[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;gap:10px}
[data-screen="trace"]{overflow:hidden}

/* home */
.hero{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0}
.hero .pig{font-size:72px;line-height:1;animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.hero h1{margin:0;font-size:36px;font-weight:700;text-wrap:balance}
.hero p{margin:2px 0 0;color:var(--ink-soft);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;padding:4px 2px;flex:1;align-content:center}
.tile{border-radius:28px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--tile,#fff);box-shadow:0 7px 0 rgba(59,39,51,.16);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(59,39,51,.16)}
.tile-ico{font-size:58px;line-height:1.1}
.tile-l{font-size:24px;font-weight:600}
.tile-s{font-family:var(--body);font-size:14px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.home-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0;color:var(--ink-soft);font-size:15px}
.link{text-decoration:underline;color:var(--ink-soft);padding:10px}

/* module screens */
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none}
.chip{border-radius:999px;padding:12px 18px;background:var(--white);border:3px solid transparent;font-size:18px;font-weight:500;box-shadow:0 3px 0 rgba(59,39,51,.12);min-height:52px}
.chip.on{border-color:var(--pink-deep);background:var(--pink-soft)}
.chip,.ctl,.tword,.hint,.card h2,.card p{unicode-bidi:plaintext}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:8px 0}
.instr{font-size:26px;font-weight:500;color:var(--ink);text-align:center;text-wrap:balance;direction:ltr;line-height:1.2}
.instr small{display:block;direction:rtl;font-size:16px;font-weight:400;color:var(--ink-soft);margin-top:4px}
.hero p small,.lvl{display:block}
.prompt{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;min-height:110px;text-align:center}
.big{font-size:clamp(72px,14vw,150px);line-height:1;font-weight:700;color:var(--pink-deep)}
.big.he{color:var(--grass-deep)}
.word{display:inline-flex;gap:6px;direction:ltr}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:96px;padding:0 10px;border-radius:18px;background:var(--white);box-shadow:0 5px 0 var(--pink-soft);font-size:64px;font-weight:600;color:var(--pink-deep)}
.lt.hit{background:var(--pink-soft)}
.he-word{font-size:clamp(56px,10vw,110px);font-weight:600;color:var(--grass-deep);line-height:1.3}
.sent{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:ltr}
.sent .w{font-size:40px;font-weight:600;padding:8px 16px;border-radius:16px;background:var(--white);box-shadow:0 4px 0 var(--sky);color:var(--ink)}
.sent .w.hit{background:var(--sky)}
.speak{background:var(--sky);box-shadow:0 4px 0 var(--sky-deep)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(100%,780px)}
.choices.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.choices.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.choice{min-height:130px;border-radius:24px;background:var(--white);border:4px solid var(--pink-soft);box-shadow:0 6px 0 var(--pink-soft);font-size:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.1;padding:10px;transition:transform .08s}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-soft)}
.choice small{font-family:var(--body);font-size:18px;color:var(--ink-soft);font-weight:700}
.choice.text{font-size:46px;font-weight:600}
.choice.grp{font-size:30px}
.choice.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 6px 0 var(--ok)}
.choice.bad{animation:shake .4s;border-color:var(--bad);opacity:.45}
.choice:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;font-size:46px;line-height:1.1}
.objs.small{font-size:30px;max-width:260px}
.objs .x{opacity:.3;text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:var(--bad)}
.eq{display:flex;align-items:center;gap:14px;direction:ltr;font-size:52px;font-weight:700;flex-wrap:wrap;justify-content:center}
.eq .grp{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:center;font-size:40px;padding:8px 12px;border-radius:18px;background:var(--white);box-shadow:0 4px 0 var(--sun)}
.eq .q{color:var(--pink-deep)}
.numline{direction:ltr;font-size:40px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seq{display:flex;gap:10px;direction:ltr}
.seq b{width:72px;height:84px;border-radius:18px;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 4px 0 var(--sun)}
.seq b.gap{background:var(--sun);color:var(--pink-deep)}
.streak{display:flex;gap:6px;justify-content:center;flex:none;padding-bottom:4px}
.streak i{width:14px;height:14px;border-radius:50%;background:var(--mud-soft)}
.streak i.on{background:var(--pink-deep)}
.lvl{font-size:14px;color:var(--ink-soft);font-family:var(--body);text-align:center}

/* spell */
.slots{display:flex;gap:10px;direction:ltr}
.slot{width:80px;height:96px;border-radius:18px;border:4px dashed var(--mud-soft);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:600;color:var(--pink-deep);background:var(--white)}
.slot.f{border-style:solid;border-color:var(--ok)}
.tiles-l{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;direction:ltr}
.tile-l2{width:84px;height:96px;border-radius:18px;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);font-size:58px;font-weight:600;transition:transform .08s}
.tile-l2:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.tile-l2.used{opacity:.25;box-shadow:none;transform:translateY(6px)}
.tile-l2.bad{animation:shake .4s}

/* trace */
.trace-head{display:flex;align-items:center;justify-content:center;gap:16px;flex:none;flex-wrap:wrap}
.tchar{font-size:64px;font-weight:700;color:var(--pink-deep);line-height:1;min-width:70px;text-align:center;background:var(--white);border-radius:18px;padding:4px 12px;box-shadow:0 4px 0 var(--pink-soft)}
.tword{font-size:26px;font-weight:500}
.meter{width:min(100%,360px);height:16px;border-radius:8px;background:var(--mud-soft);overflow:hidden;flex:none;align-self:center}
.meter i{display:block;height:100%;width:0;background:var(--mud);transition:width .2s}
.canvas-wrap{flex:1;min-height:180px;position:relative;width:100%;max-width:960px;align-self:center;background:var(--white);border-radius:24px;overflow:hidden;box-shadow:inset 0 0 0 4px var(--pink-soft)}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:20px;color:var(--ink-soft);pointer-events:none;transition:opacity .3s}
.trace-ctl{display:flex;gap:12px;justify-content:center;flex:none;flex-wrap:wrap}
.ctl{height:60px;padding:0 22px;border-radius:999px;background:var(--white);box-shadow:0 5px 0 rgba(59,39,51,.14);font-size:20px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .08s}
.ctl:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,39,51,.14)}
.ctl.pri{background:var(--pink-deep);color:#fff;box-shadow:0 5px 0 #a8305f}
.picker{display:none;flex-wrap:wrap;gap:8px;justify-content:center;flex:none;max-height:38%;overflow:auto;padding:4px}
.picker.open{display:flex}
.picker button{width:60px;height:60px;border-radius:14px;background:var(--white);font-size:30px;font-weight:600;box-shadow:0 3px 0 var(--pink-soft)}
.picker button.done{background:var(--ok-soft)}

/* princess */
.sinfo{text-align:center;font-size:22px;color:var(--ink-soft);direction:ltr}
.sinfo small{display:block;direction:rtl;font-size:15px}
.pwrap{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:4px}
.stage{position:relative;width:min(100%,340px);aspect-ratio:3/4;flex:none;border-radius:28px;overflow:hidden;background:linear-gradient(#CDEBFF 0,#EAF6FF 55%,#BFE8A0 56%,#A6DB7C 100%);box-shadow:0 8px 0 rgba(59,39,51,.14)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.pi{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;z-index:3}
.pi.back{z-index:1}
.tray{flex:1 1 320px;min-width:0;direction:ltr;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;max-width:620px}
.pit{aspect-ratio:1;border-radius:20px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:40px;box-shadow:0 5px 0 var(--mud-soft);border:4px solid transparent;transition:transform .08s}
.pit:active{transform:translateY(3px)}
.pit small{font-family:var(--body);font-size:11px;color:var(--ink-soft);font-weight:700;direction:ltr;text-align:center;line-height:1.1}
.pit.on{border-color:var(--pink-deep);background:var(--pink-soft)}
.pit.lock{filter:grayscale(1);opacity:.45}
.pit.lock span{font-size:28px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(59,39,51,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.card{background:var(--cream);border-radius:32px;padding:28px 24px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.card h2{margin:0;font-size:30px}
.card .huge{font-size:120px;line-height:1;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.card label{display:flex;flex-direction:column;gap:6px;text-align:start;font-size:16px;color:var(--ink-soft)}
.card input[type=text]{font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid var(--mud-soft);background:#fff;color:var(--ink)}
.card input[type=range]{width:100%}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctl.danger{background:#fff;color:var(--bad);box-shadow:0 5px 0 #f3c2c2}

/* burst */
.burst{position:fixed;left:50%;top:50%;font-size:40px;pointer-events:none;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--r));opacity:0}}
.fb{font-size:30px;font-weight:700;color:var(--ok);min-height:36px;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl">
  <header class="top">
    <button class="icon-btn" id="homeBtn" aria-label="הביתה">🏠</button>
    <div class="title" id="ttl">Shirly &amp; Peppa 🐷</div>
    <div class="stars">⭐ <span id="starN">0</span></div>
  </header>

  <main>
    <section data-screen="home">
      <div class="hero">
        <div class="pig">🐷</div>
        <div><h1>היי <span id="hname">שירלי</span>!</h1><p dir="ltr">What shall we learn today?<small>מה נלמד היום עם פפה?</small></p></div>
      </div>
      <div class="tiles">
        <button class="tile" data-go="trace" style="--tile:var(--pink-soft)"><span class="tile-ico">✏️</span><span class="tile-l">כותבים באצבע</span><span class="tile-s">Trace letters</span></button>
        <button class="tile" data-go="read" style="--tile:var(--sky)"><span class="tile-ico">📖</span><span class="tile-l">קוראים אנגלית</span><span class="tile-s">Reading</span></button>
        <button class="tile" data-go="math" style="--tile:var(--sun)"><span class="tile-ico">🔢</span><span class="tile-l">חשבון</span><span class="tile-s">Numbers</span></button>
        <button class="tile" data-go="hebrew" style="--tile:var(--grass)"><span class="tile-ico">🇮🇱</span><span class="tile-l">עברית</span><span class="tile-s">Hebrew</span></button>
        <button class="tile" data-go="princess" style="--tile:#EBDDF7"><span class="tile-ico">👸</span><span class="tile-l">הנסיכה שלי</span><span class="tile-s">My princess</span></button>
      </div>
      <div class="home-foot">
        <span>10 stars = a new princess gift 🎁 · כל 10 כוכבים מתנה לנסיכה</span>
        <button class="link" id="parentsBtn">הורים ⚙️</button>
      </div>
    </section>

    <section data-screen="read" hidden>
      <div class="modes"></div>
      <div class="game"></div>
      <div class="streak"></div>
    </section>
    <section data-screen="math" hidden>
      <div class="modes"></div>
      <div class="game"></div>
      <div class="streak"></div>
    </section>
    <section data-screen="hebrew" hidden>
      <div class="modes"></div>
      <div class="game"></div>
      <div class="streak"></div>
    </section>

    <section data-screen="trace" hidden>
      <div class="modes" id="tmodes"></div>
      <div class="trace-head">
        <button class="tchar" id="tchar" aria-label="בחרי אות">A</button>
        <div class="tword" id="tword"></div>
        <button class="icon-btn speak" id="tsay" aria-label="הקראה">🔊</button>
      </div>
      <div class="picker" id="tpick"></div>
      <div class="meter"><i id="tmeter"></i></div>
      <div class="canvas-wrap" id="cwrap">
        <canvas id="gcanvas"></canvas>
        <canvas id="tcanvas"></canvas>
        <div class="hint" id="thint">Start at 1 and follow the arrows 🐽</div>
      </div>
      <div class="trace-ctl">
        <button class="ctl" id="tprev">◀ Back</button>
        <button class="ctl" id="tclear">🧽 Clear</button>
        <button class="ctl" id="tshow">👀 Show me</button>
        <button class="ctl pri" id="tnext">Next ▶</button>
      </div>
    </section>

    <section data-screen="princess" hidden>
      <div class="sinfo" id="sinfo"></div>
      <div class="pwrap">
        <div class="stage" id="stage"></div>
        <div class="tray" id="tray"></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(arr,n,excl)=>shuffle(arr.filter(x=>!excl||!excl(x))).slice(0,n);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

/* ---------- state ---------- */
const KEY='shirly-peppa-v1';
const DEF={name:'שירלי',nameEn:'Shirly',stars:0,rate:0.85,lv:{},traced:{},wear:null};
let S=load();
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign({},DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* princess gifts: [emoji, english, hebrew, x%, y%, size px, layer] — dress items carry a color instead of a position */
const GIFTS=[
 ['👑','a golden crown','כתר זהב',50,9,56],
 ['🪄','a magic wand','שרביט קסמים',84,62,48],
 ['🎀','a pink bow','פפיון ורוד',68,16,40],
 ['👠','sparkly shoes','נעליים נוצצות',50,94,40],
 ['💎','a diamond necklace','שרשרת יהלומים',50,46,28],
 ['👗','a purple dress','שמלה סגולה','#A569D6'],
 ['🦄','a unicorn friend','חברה חד-קרן',14,78,64],
 ['🌸','a flower for your hair','פרח לשיער',32,17,36],
 ['🧸','a teddy bear','דובי',86,86,48],
 ['👜','a little handbag','תיק קטן',12,74,44],
 ['🌈','a rainbow','קשת בענן',50,14,120,'back'],
 ['👗','a blue dress','שמלה כחולה','#4FA8E0'],
 ['🐷','Peppa, your best friend','פפה, החברה הכי טובה',84,70,56],
 ['🦋','a butterfly','פרפר',80,28,40],
 ['💍','a shiny ring','טבעת נוצצת',20,70,24],
 ['🏰','a castle','טירה',50,30,150,'back'],
 ['🎈','a red balloon','בלון אדום',90,10,52],
 ['👗','a golden dress','שמלת זהב','#E8B923'],
 ['🕶️','cool sunglasses','משקפי שמש',50,26,38],
 ['🧚','a fairy friend','פיה חברה',18,24,52],
 ['🐰','a bunny','ארנבון',24,90,48],
 ['🍭','a lollipop','סוכרייה על מקל',82,56,40],
 ['👒','a glitter hat','כובע נצנצים',50,7,60],
 ['👗','a green dress','שמלה ירוקה','#5DAE3F'],
 ['🌙','a moon','ירח',86,14,56,'back'],

    };

    setTimeout(()=>{
      list.forEach(it=>{
        const u=new SpeechSynthesisUtterance(it.t);

/* ---------- sound fx ---------- */
const FX={ctx:null,
  tone(f,at,dur,type='sine',g=0.18){
    try{
      if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(this.ctx.state==='suspended')this.ctx.resume();
      const o=this.ctx.createOscillator(),a=this.ctx.createGain();
      o.type=type;o.frequency.value=f;const t=this.ctx.currentTime+at;
      a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g,t+0.02);a.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(a);a.connect(this.ctx.destination);o.start(t);o.stop(t+dur+0.05);
    }catch(e){}
  },
  tap(){this.tone(880,0,0.06,'sine',0.05)},
  ok(){[523,659,784].forEach((f,i)=>this.tone(f,i*0.09,0.2))},
  no(){this.tone(180,0,0.25,'square',0.06)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,i*0.1,0.35,'triangle',0.2))}
};
function burst(){
  const ems=['⭐','🌟','💖','🐷','✨','🎈'];

    const s=el('span','burst',pick(ems));

    s.style.setProperty('--dx',Math.cos(ang)*d+'px');s.style.setProperty('--dy',Math.sin(ang)*d+'px');
    s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.append(s);setTimeout(()=>s.remove(),1200);
  }
}

/* ---------- quiz engine ---------- */
const TITLES={read:'Reading 📖',math:'Numbers 🔢',hebrew:'עברית 🇮🇱'};
let cur=null;
const UPS=[0,4,5,6,6]; // correct answers in a row needed to leave each level
function lvState(id){let v=S.lv[id];if(!v||typeof v!=='object'){v={lv:1,run:0,miss:0};S.lv[id]=v}return v}
function level(id){return lvState(id).lv}
function bumpStreak(id,ok){
  const v=lvState(id);let ev=null;
  if(ok){v.run++;v.miss=0;if(v.lv<4&&v.run>=UPS[v.lv]){v.lv++;v.run=0;ev='up'}}
  else{v.miss++;v.run=0;if(v.miss>=3&&v.lv>1){v.lv--;v.miss=0;ev='down'}}
  save();return ev;
}
function startModule(id){
  const M=MODULES[id];M.el=M.el||$(`[data-screen="${id}"]`);
  cur={id,M,mode:M.modes.find(m=>m.gen)};
  go(id);$('#ttl').textContent=TITLES[id];renderModes();next();
}
function renderModes(){
  const box=$('.modes',cur.M.el);box.innerHTML='';
  cur.M.modes.forEach(m=>{
    const b=el('button','chip'+(m===cur.mode?' on':''),m.label);
    b.onclick=()=>{FX.tap();if(m.open){m.open();return}cur.mode=m;renderModes();next()};
    box.append(b);
  });
}
function renderStreak(){
  const box=$('.streak',cur.M.el);box.innerHTML='';
  const v=lvState(cur.mode.id),lv=v.lv,need=UPS[lv];
  for(let i=0;i<need;i++)box.append(el('i',i<v.run?'on':''));
  const l=el('div','lvl',cur.id==='hebrew'?'שלב '+lv:'Level '+lv);box.append(l);
}
function next(){
  if(!cur)return;
  const q=cur.mode.gen(level(cur.mode.id));
  q.lang=q.lang||(cur.id==='hebrew'?'he':'en');
  renderStreak();
  if(q.type==='spell')renderSpell(q);else renderChoice(q);
}
function good(q,pre){
  FX.ok();award(1);const ev=bumpStreak(cur.mode.id,true);renderStreak();
  combo++;const extra=q.onGood?q.onGood():[];
  const c=COMBO[q.lang][combo];const lv=level(cur.mode.id);
  const list=(pre?[{t:pre,l:q.lang}]:[]).concat([{t:praise(q.lang),l:q.lang}],extra,c?[{t:nm(c,q.lang),l:q.lang}]:[]);
  if(ev==='up')list.push({t:q.lang==='he'?`עלית שלב! שלב ${lv}!`:`Level up! Level ${lv}!`,l:q.lang});
  TTS.sayAll(list);
  if(c||ev==='up')burst();
}
function bad(q,pre){FX.no();combo=0;bumpStreak(cur.mode.id,false);renderStreak();TTS.sayAll((pre?[{t:pre,l:q.lang}]:[]).concat([{t:retry(q.lang),l:q.lang}]))}

function renderChoice(q){
  const g=$('.game',cur.M.el);g.innerHTML='';
  const instr=el('div','instr',(q.instr||'')+(q.he?`<small>${q.he}</small>`:''));
  const prompt=el('div','prompt',q.prompt||'');
  const spk=el('button','icon-btn speak','🔊');spk.setAttribute('aria-label','הקראה');
  const voice=()=>{const v=(q.voice?q.voice():[]).map(x=>Object.assign({l:q.lang},x));const list=(v[0]&&v[0].t===q.instr)?v:[{t:q.instr,l:q.lang}].concat(v);TTS.sayAll(list)};
  spk.onclick=()=>{FX.tap();voice()};
  const ch=el('div','choices'+(q.choices.length===2?' c2':q.choices.length===4?' c4':''));
  let done=false;
  q.choices.forEach(c=>{
    const b=el('button','choice'+(c.cls?' '+c.cls:''),c.html);
    if(c.dir)b.dir=c.dir;
    b.onclick=()=>{
      if(done||b.disabled)return;

const MAX=[0,5,10,20,20];
function numChoices(ans,max,n=3){
  const set=new Set([ans]);let tries=0;
  while(set.size<n&&tries++<80){const d=ans+(rnd(7)-3);if(d>=0&&d<=Math.max(max,ans+3))set.add(d)}
  while(set.size<n)set.add(ans+set.size);
  return shuffle([...set]).map(v=>({html:String(v),ok:v===ans,cls:'text',dir:'ltr',say:String(v)}));
}
const objs=(e,n,cls='')=>`<div class="objs ${cls}">${Array.from({length:n},()=>`<span>${e}</span>`).join('')}</div>`;
function genCount(lv){
  const max=[0,5,10,15,20][lv];const n=1+rnd(max);const e=pick(ITEMS);
  const vis=lv<4?objs(e,n):`<div class="objs">${Array.from({length:n},(_,i)=>`<span>${i%2?pick(ITEMS):e}</span>`).join('')}</div>`;
  return {instr:'How many?',he:'כמה יש?',prompt:vis,voice:()=>[{t:'How many?'}],onGood:()=>[{t:`There are ${n}`,l:'en'}],choices:numChoices(n,max,lv>=3?4:3)};
}
function genAdd(lv){
  const max=MAX[lv];const a=1+rnd(max-1);const b=1+rnd(Math.max(1,max-a));const e=pick(ITEMS),e2=lv===1?e:pick(ITEMS);
  const vis=lv<3?`<div class="eq"><span class="grp">${e.repeat(a)}</span><b>+</b><span class="grp">${e2.repeat(b)}</span></div>`:'';
  return {instr:`What is ${a} plus ${b}?`,he:'כמה זה ביחד?',prompt:`${vis}<div class="numline">${a} + ${b} = <b class="q">?</b></div>`,
    voice:()=>[{t:`What is ${a} plus ${b}?`}],onGood:()=>[{t:`${a} plus ${b} is ${a+b}`,l:'en'}],choices:numChoices(a+b,max,lv>=3?4:3)};

function genSub(lv){
  const max=MAX[lv];const a=2+rnd(max-1);const b=1+rnd(a-1);const e=pick(ITEMS);

  return {instr:`${a} take away ${b}. How many are left?`,he:'כמה נשארו?',prompt:`${vis}<div class="numline">${a} − ${b} = <b class="q">?</b></div>`,
    voice:()=>[{t:`${a} take away ${b}. How many are left?`}],onGood:()=>[{t:`${a} take away ${b} is ${a-b}`,l:'en'}],choices:numChoices(a-b,max,lv>=3?4:3)};

function genCompare(lv){
  const max=MAX[lv];let a=1+rnd(max),b=1+rnd(max);while(b===a)b=1+rnd(max);
  const more=lv<2||rnd(2)===0;const e=pick(ITEMS),e2=lv<3?e:pick(ITEMS);

  const mk=(v,em)=>lv<4?{html:objs(em,v,'small'),cls:'grp',say:String(v)}:{html:String(v),cls:'text',dir:'ltr',say:String(v)};

 'ס':[arc(50,61,35,39,-90,-450)],
 'ע':[[[82,18],[55,75],[15,100]],[[22,18],[50,70]]],
 'פ':[[[15,18],[62,18],...arc(62,61,25,39,-90,90),[15,100]],[[70,42],[50,42],[50,62]]],
 'ף':[[[15,18],[80,18],[80,125]],[[70,42],[50,42],[50,62]]],
 'צ':[[[80,18],[58,60],[20,100],[80,100]],[[25,18],[52,62]]],
 'ץ':[[[72,18],[72,125]],[[28,18],[72,70]]],
 'ק':[[[25,18],[78,18],[78,70],[60,80]],[[25,35],[25,125]]],
 'ר':[[[15,18],[70,18],...arc(70,36,14,14,-90,0),[84,100]]],
 'ש':[[[18,18],[18,100],[82,100],[82,18]],[[50,30],[50,100]]],

};
const BOX={upper:{top:0,base:100,bot:100},lower:{top:0,xh:45,base:100,bot:135},num:{top:0,base:100,bot:100},he:{top:18,base:100,bot:125}};

/* ---------- tracing ---------- */
const Trace={
  sets:{
    upper:{label:'ABC',chars:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],lang:'en'},
    lower:{label:'abc',chars:[...'abcdefghijklmnopqrstuvwxyz'],lang:'en'},
    num:{label:'123',chars:[...'0123456789'],lang:'en'},
    he:{label:'א-ב',chars:[...'אבגדהוזחטיכךלמםנןסעפףצץקרשת'],lang:'he'}
  },
  setId:'upper',idx:0,W:0,H:0,dpr:1,drawing:false,passed:false,nUser:0,anim:0,
  init(){
    this.wrap=$('#cwrap');this.cv=$('#tcanvas');this.ctx=this.cv.getContext('2d');
    this.gcv=$('#gcanvas');this.gctx=this.gcv.getContext('2d');
    this.tol=document.createElement('canvas');
    const cv=this.cv;
    cv.addEventListener('pointerdown',e=>this.down(e));
    cv.addEventListener('pointermove',e=>this.move(e));
    cv.addEventListener('pointerup',e=>this.up(e));
    cv.addEventListener('pointercancel',e=>this.up(e));
    new ResizeObserver(()=>this.resize()).observe(this.wrap);
    $('#tprev').onclick=()=>{FX.tap();this.step(-1)};
    $('#tnext').onclick=()=>{FX.tap();this.step(1)};
    $('#tclear').onclick=()=>{FX.tap();this.clear()};
    $('#tshow').onclick=()=>{FX.tap();this.demo()};
    $('#tsay').onclick=()=>{FX.tap();this.sayChar()};
    $('#tchar').onclick=()=>{FX.tap();$('#tpick').classList.toggle('open')};
  },
  he(){return this.sets[this.setId].lang==='he'},
  open(setId){
    this.setId=setId;this.idx=0;go('trace');$('#ttl').textContent='Trace ✏️';
    $('#tpick').classList.remove('open');this.renderChips();this.renderPicker();
    this.W=0;this.resize();
  },
  renderChips(){
    const box=$('#tmodes');box.innerHTML='';
    Object.entries(this.sets).forEach(([id,s])=>{
      const b=el('button','chip'+(id===this.setId?' on':''),s.label);
      b.onclick=()=>{FX.tap();this.open(id)};box.append(b);
    });
  },
  renderPicker(){
    const box=$('#tpick');box.innerHTML='';
    this.sets[this.setId].chars.forEach((c,i)=>{
      const b=el('button',(S.traced[this.setId+c]?'done':''),c);
      b.onclick=()=>{FX.tap();this.idx=i;box.classList.remove('open');this.show()};box.append(b);
    });
  },
  resize(){
    const r=this.wrap.getBoundingClientRect();
    if(r.width<10||r.height<10)return;
    if(Math.abs(r.width-this.W)<1&&Math.abs(r.height-this.H)<1)return;
    this.W=r.width;this.H=r.height;this.dpr=Math.min(2,window.devicePixelRatio||1);
    [this.cv,this.gcv].forEach(c=>{c.width=Math.round(this.W*this.dpr);c.height=Math.round(this.H*this.dpr)});
    this.tol.width=Math.round(this.W);this.tol.height=Math.round(this.H);
    this.layout();this.show();
  },
  layout(){
    const {W,H}=this;const box=BOX[this.setId];
    const k=Math.min(H*0.82/box.bot,W*0.7/100);
    this.k=k;this.ox=(W-100*k)/2;this.oy=(H-box.bot*k)/2;
    this.penW=Math.max(10,Math.min(26,9*k));
    this.lines={top:this.oy+box.top*k,base:this.oy+100*k,xh:box.xh!=null?this.oy+box.xh*k:null,bot:box.bot>100?this.oy+box.bot*k:null};
  },
  current(){return this.sets[this.setId].chars[this.idx]},
  P(p){return [this.ox+p[0]*this.k,this.oy+p[1]*this.k]},
  // walk a polyline, calling fn(point, angle) every `gap` px; returns total length
  walk(path,gap,fn){
    let acc=0,len=0,next=0;
    for(let i=1;i<path.length;i++){
      const [x0,y0]=path[i-1],[x1,y1]=path[i];const d=Math.hypot(x1-x0,y1-y0);if(!d)continue;
      const ang=Math.atan2(y1-y0,x1-x0);
      while(next<=acc+d){const t=(next-acc)/d;fn([x0+(x1-x0)*t,y0+(y1-y0)*t],ang);next+=gap}
      acc+=d;
    }
    return acc;
  },
  pointAt(path,frac){
    let total=0;for(let i=1;i<path.length;i++)total+=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
    let target=total*frac,acc=0;
    for(let i=1;i<path.length;i++){const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
      if(acc+d>=target||i===path.length-1){const t=d?(target-acc)/d:0;return {p:[path[i-1][0]+(path[i][0]-path[i-1][0])*t,path[i-1][1]+(path[i][1]-path[i-1][1])*t],ang:Math.atan2(path[i][1]-path[i-1][1],path[i][0]-path[i-1][0]),total}}
      acc+=d}
    return {p:path[0],ang:0,total};
  },
  show(){
    if(!this.W)return;
    cancelAnimationFrame(this.anim);
    const {W,H,dpr,penW}=this;const ch=this.current();const L=this.lines;
    this.passed=false;this.nUser=0;this.hinted=false;this.hinted2=false;this.dirHinted=false;
    $('#tmeter').style.width='0%';
    const h=$('#thint');h.style.opacity=1;
    h.textContent=this.he()?'התחילי ב-1 ועקבי אחרי החצים 🐽':'Start at 1 and follow the arrows 🐽';
    const strokes=(STROKES[ch]||[]).map(s=>s.map(p=>this.P(p)));
    this.strokes=strokes;
    // tolerance band (CSS px) + sample points along the strokes
    const t=this.tol.getContext('2d');t.clearRect(0,0,W,H);
    t.lineCap='round';t.lineJoin='round';t.strokeStyle='#000';t.fillStyle='#000';t.lineWidth=penW*2.4;
    this.samples=[];
    strokes.forEach(s=>{
      if(s.length<2)return;
      t.beginPath();t.moveTo(s[0][0],s[0][1]);s.slice(1).forEach(p=>t.lineTo(p[0],p[1]));t.stroke();
      const len=this.walk(s,Math.max(5,penW*0.45),p=>this.samples.push(p));
      if(len<penW)t.beginPath(),t.arc(s[0][0],s[0][1],penW*1.4,0,7),t.fill();
    });
    this.tolData=t.getImageData(0,0,W,H).data;
    // guide layer
    const g=this.gctx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const line=(y,color,w,dash)=>{g.beginPath();g.setLineDash(dash||[]);g.lineWidth=w;g.strokeStyle=color;g.moveTo(16,y);g.lineTo(W-16,y);g.stroke();g.setLineDash([])};
    line(L.top,'#4FA8E0',3);line(L.base,'#E0528F',3);
    if(L.xh!=null)line(L.xh,'#B9A9B1',2,[10,10]);
    if(L.bot!=null)line(L.bot,'#DDD3D8',2);
    g.lineCap='round';g.lineJoin='round';
    strokes.forEach(s=>{ // faint body
      g.beginPath();g.lineWidth=penW;g.strokeStyle='rgba(224,82,143,.13)';
      g.moveTo(s[0][0],s[0][1]);(s.length>1?s.slice(1):[[s[0][0]+0.1,s[0][1]]]).forEach(p=>g.lineTo(p[0],p[1]));g.stroke();
    });
    g.fillStyle='#E0528F';
    strokes.forEach(s=>{ // dotted centre line
      if(s.length<2||this.pointAt(s,1).total<penW){g.beginPath();g.arc(s[0][0],s[0][1],penW*0.45,0,7);g.fill();return}
      this.walk(s,Math.max(8,penW*0.8),p=>{g.beginPath();g.arc(p[0],p[1],penW*0.2,0,7);g.fill()});
    });
    strokes.forEach((s,i)=>{ // direction arrows at 55% of each stroke (and 85% of long ones)
      const info=this.pointAt(s,0.55);if(info.total<penW*2.5)return;
      const fr=info.total>penW*14?[0.3,0.75]:[0.55];
      fr.forEach(f=>{const q=this.pointAt(s,f);this.arrow(g,q.p,q.ang,penW*0.95)});
    });
    const placed=[];
    strokes.forEach((s,i)=>{ // numbered start badges, nudged along the stroke when two would overlap
      const r=Math.max(12,penW*0.75);let [x,y]=s[0];
      for(const f of [0,0.1,0.18,0.26,0.34]){const q=this.pointAt(s,f).p;if(!placed.some(b=>Math.hypot(b[0]-q[0],b[1]-q[1])<r*2.3)){[x,y]=q;break}}
      placed.push([x,y]);
      g.beginPath();g.arc(x,y,r,0,7);g.fillStyle='#43B55B';g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();
      g.fillStyle='#fff';g.font=`700 ${Math.round(r*1.3)}px Fredoka, Nunito, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),x,y+1);
    });
    // drawing layer
    const c=this.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    $('#tchar').textContent=ch;$('#tword').innerHTML=this.wordFor(ch).html;
    $$('#tpick button').forEach((b,i)=>b.style.outline=i===this.idx?'4px solid #E0528F':'');
    this.sayChar();
  },
  arrow(g,p,ang,s){
    g.save();g.translate(p[0],p[1]);g.rotate(ang);
    g.beginPath();g.moveTo(s,0);g.lineTo(-s*0.7,-s*0.8);g.lineTo(-s*0.3,0);g.lineTo(-s*0.7,s*0.8);g.closePath();
    g.fillStyle='#A8305F';g.fill();g.lineWidth=2;g.strokeStyle='#fff';g.stroke();g.restore();
  },
  wordFor(ch){
    const set=this.setId;
    if(set==='num'){const n=+ch;return {html:`${NUMW[n]} ${n?'🐷'.repeat(Math.min(n,9)):''}`,say:[{t:NUMW[n],l:'en'}]}}
    if(set==='he'){
      const r=HE.find(x=>x[0]===ch);
      if(r)return {html:`${r[1]} · ${r[2]} ${r[3]}`,say:[{t:r[1],l:'he'},{t:r[2],l:'he'}]};
      return {html:HEF[ch],say:[{t:HEF[ch],l:'he'}]};
    }
    const r=EN.find(x=>x[0]===ch.toUpperCase());
    const name=set==='lower'?`little ${ch}`:ch;
    return {html:`<span dir="ltr">${ch} · ${r[1]} ${r[2]}</span>`,say:[{t:name,l:'en'},{t:PH[ch.toLowerCase()]+'.',l:'en',rate:0.75},{t:r[1],l:'en'}]};
  },
  sayChar(){TTS.sayAll(this.wordFor(this.current()).say)},
  step(d){const n=this.sets[this.setId].chars.length;this.idx=(this.idx+d+n)%n;this.show()},
  clear(){cancelAnimationFrame(this.anim);this.ctx.clearRect(0,0,this.W,this.H);this.passed=false;this.nUser=0;$('#tmeter').style.width='0%'},
  pt(e){const r=this.cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}},
  down(e){
    if(this.passed)return;e.preventDefault();cancelAnimationFrame(this.anim);
    this.drawing=true;try{this.cv.setPointerCapture(e.pointerId)}catch(err){}
    const c=this.ctx;c.lineCap='round';c.lineJoin='round';c.lineWidth=this.penW;c.strokeStyle='#E0528F';
    const p=this.pt(e);this.last=p;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+0.01,p.y);c.stroke();
    $('#thint').style.opacity=0;
    // gentle direction hint: first stroke started at the wrong end of stroke 1
    if(this.nUser===0&&!this.dirHinted&&this.strokes.length){
      const s=this.strokes[0],a=s[0],b=s[s.length-1];
      const d0=Math.hypot(p.x-a[0],p.y-a[1]),d1=Math.hypot(p.x-b[0],p.y-b[1]);
      if(d0>this.penW*3&&d1<d0){this.dirHinted=true;const h=$('#thint');h.textContent=this.he()?'התחילי מהעיגול הירוק 1 🟢':'Start at the green 1 🟢';h.style.opacity=1;TTS.say(this.he()?'התחילי מהעיגול הירוק':'Start at the green number one',this.he()?'he':'en')}
    }
  },
  move(e){
    if(!this.drawing)return;e.preventDefault();
    const pts=e.getCoalescedEvents?e.getCoalescedEvents():[e];const c=this.ctx;
    pts.forEach(ev=>{const p=this.pt(ev);c.beginPath();c.moveTo(this.last.x,this.last.y);c.lineTo(p.x,p.y);c.stroke();this.last=p});
  },
  up(e){if(!this.drawing)return;this.drawing=false;this.nUser++;this.check()},
  check(){
    const {W,H,dpr,penW}=this;const dw=this.cv.width,dh=this.cv.height;
    const img=this.ctx.getImageData(0,0,dw,dh).data;
    const a=(x,y)=>{const X=Math.floor(x*dpr),Y=Math.floor(y*dpr);if(X<0||Y<0||X>=dw||Y>=dh)return 0;return img[(Y*dw+X)*4+3]};
    const r=penW*0.8;let cov=0;
    this.samples.forEach(([x,y])=>{if(a(x,y)>40||a(x+r,y)>40||a(x-r,y)>40||a(x,y+r)>40||a(x,y-r)>40)cov++});
    let drawn=0,inside=0;const st=5;
    for(let y=2;y<H;y+=st)for(let x=2;x<W;x+=st){if(a(x,y)>40){drawn++;if(this.tolData[(y*W+x)*4+3]>0)inside++}}
    const coverage=this.samples.length?cov/this.samples.length:0,precision=drawn?inside/drawn:1;
    $('#tmeter').style.width=Math.round(coverage*100)+'%';
    const h=$('#thint');
    if(coverage>=0.6&&precision>=0.55)this.success();
    else if(precision<0.4&&drawn>60&&!this.hinted){this.hinted=true;h.textContent=this.he()?'נסי להישאר על הנקודות 🙂':'Try to stay on the dots 🙂';h.style.opacity=1;TTS.say(this.he()?'נסי להישאר על הנקודות':'Try to stay on the dots',this.he()?'he':'en')}
    else if(this.nUser>=6&&coverage<0.6&&!this.hinted2){this.hinted2=true;h.textContent=this.he()?'לחצי על 👀 Show me אם צריך עזרה':'Tap 👀 Show me if you need help';h.style.opacity=1}
  },
  success(){
    this.passed=true;FX.win();burst();award(2);
    S.traced[this.setId+this.current()]=1;save();this.renderPicker();
    const lang=this.sets[this.setId].lang;
    TTS.sayAll([{t:praise(lang),l:lang}]);
    const h=$('#thint');h.textContent=lang==='he'?'מעולה! ⭐⭐':'Brilliant! ⭐⭐';h.style.opacity=1;
    setTimeout(()=>{if(this.passed)this.step(1)},1900);
  },
  demo(){
    cancelAnimationFrame(this.anim);const {W,H,penW}=this;const c=this.ctx;
    c.clearRect(0,0,W,H);this.passed=false;this.nUser=0;$('#tmeter').style.width='0%';
    const strokes=this.strokes;const lens=strokes.map(s=>Math.max(penW,this.pointAt(s,1).total));
    const total=lens.reduce((a,b)=>a+b,0);const dur=Math.max(1200,total*4);const t0=performance.now();
    const frame=now=>{
      let prog=Math.min(1,(now-t0)/dur)*total;c.clearRect(0,0,W,H);
      c.lineCap='round';c.lineJoin='round';c.lineWidth=penW;c.strokeStyle='rgba(224,82,143,.6)';let head=null;
      for(let i=0;i<strokes.length;i++){
        const s=strokes[i],len=lens[i];const f=Math.max(0,Math.min(1,prog/len));
        if(f<=0)break;
        const end=this.pointAt(s,f);c.beginPath();c.moveTo(s[0][0],s[0][1]);
        let acc=0,target=this.pointAt(s,1).total*f;
        for(let j=1;j<s.length;j++){const d=Math.hypot(s[j][0]-s[j-1][0],s[j][1]-s[j-1][1]);if(acc+d>=target){c.lineTo(end.p[0],end.p[1]);break}c.lineTo(s[j][0],s[j][1]);acc+=d}
        c.stroke();if(f<1)head=end.p;prog-=len;
      }
      if(head){c.beginPath();c.arc(head[0],head[1],penW*0.9,0,7);c.fillStyle='#43B55B';c.fill()}
      if((now-t0)<dur)this.anim=requestAnimationFrame(frame);else setTimeout(()=>{if(!this.drawing)c.clearRect(0,0,W,H)},900);
    };
    this.anim=requestAnimationFrame(frame);
    const lang=this.sets[this.setId].lang;TTS.say(lang==='he'?'ככה כותבים. עכשיו את!':'Like this. Now you try!',lang);
  }
};
Trace.init();

  </svg>`;
}
function renderPrincess(){
  const n=giftCount();const w=wearing();
  const st=$('#stage');st.innerHTML=princessSVG(w.dress);
  w.items.filter(i=>i<n).forEach(i=>{const g=GIFTS[i];const e=el('div','pi'+(g[6]==='back'?' back':''),g[0]);e.style.left=g[3]+'%';e.style.top=g[4]+'%';e.style.fontSize=g[5]+'px';st.append(e)});
  const tray=$('#tray');tray.innerHTML='';
  GIFTS.forEach((g,i)=>{
    const owned=i<n;const on=isDress(g)?w.dress===g[3]:w.items.includes(i);
    const b=el('button','pit'+(owned?(on?' on':''):' lock'),`<span>${owned?g[0]:'🎁'}</span><small>${owned?g[1]:'⭐ '+(i+1)*10}</small>`);
    if(isDress(g)&&owned)b.style.background=on?g[3]+'33':'';
    b.onclick=()=>{
      FX.tap();
      if(!owned){TTS.say(`You need ${(i+1)*10} stars for this one, ${S.nameEn||'Shirly'}!`);return}
      if(isDress(g))w.dress=g[3];else{const k=w.items.indexOf(i);k>=0?w.items.splice(k,1):w.items.push(i)}
      save();renderPrincess();if(!on)TTS.say(g[1]);
    };
    tray.append(b);
  });
  const left=10-(S.stars%10);
  $('#sinfo').innerHTML=n>=GIFTS.length?`Your princess has everything! 🏆<small>לנסיכה יש הכול!</small>`:`${n} gifts · ${left} more stars for the next gift<small>${n} מתנות · עוד ${left} כוכבים למתנה הבאה</small>`;
}
function giftModal(g){
  FX.win();burst();
  const m=el('div','modal',`<div class="card"><h2 dir="ltr">A gift for your princess!</h2><div class="huge">${g[0]}</div><p style="margin:0;font-size:22px" dir="ltr">${g[1][0].toUpperCase()+g[1].slice(1)}! Well done, ${S.nameEn||'Shirly'}!</p><p style="margin:0;font-size:15px;color:var(--ink-soft)">${g[2]} · כל הכבוד!</p><div class="row"><button class="ctl pri" id="mok">Dress her up! 👸</button><button class="ctl" id="mlater">Later</button></div></div>`);
  document.body.append(m);
  $('#mok',m).onclick=()=>{FX.tap();m.remove();renderPrincess();go('princess');$('#ttl').textContent='My princess 👸'};
  $('#mlater',m).onclick=()=>{FX.tap();m.remove()};
  TTS.say(`Hooray, ${S.nameEn||'Shirly'}! ${g[1]} for your princess!`);
}

/* ---------- parents ---------- */
$('#parentsBtn').onclick=()=>{
  const m=el('div','modal',`<div class="card" dir="rtl"><h2>הגדרות להורים</h2>
    <label>שם בעברית (לעברית)<input type="text" id="pname" value="${S.name.replace(/"/g,'&quot;')}"></label>
    <label>שם באנגלית (להקראה באנגלית)<input type="text" id="pnameEn" dir="ltr" value="${(S.nameEn||'Shirly').replace(/"/g,'&quot;')}"></label>
    <label>מהירות דיבור: <span id="prv">${S.rate}</span><input type="range" id="prate" min="0.6" max="1.2" step="0.05" value="${S.rate}"></label>
    <p style="margin:0;color:var(--ink-soft);font-size:15px">⭐ ${S.stars} כוכבים · ${giftCount()} מתנות · אותיות שנכתבו: ${Object.keys(S.traced).length}</p>
    <div class="row"><button class="ctl pri" id="psave">שמירה</button><button class="ctl" id="pclose">סגירה</button><button class="ctl danger" id="preset">איפוס התקדמות</button></div></div>`);
  document.body.append(m);
  $('#prate',m).oninput=e=>$('#prv',m).textContent=e.target.value;
  $('#psave',m).onclick=()=>{S.name=$('#pname',m).value.trim()||'שירלי';S.nameEn=$('#pnameEn',m).value.trim()||'Shirly';S.rate=+$('#prate',m).value;save();renderStars();m.remove()};
  $('#pclose',m).onclick=()=>m.remove();
  let armed=false;
  $('#preset',m).onclick=e=>{if(!armed){armed=true;e.target.textContent='בטוח? לחצי שוב למחיקה';return}S=Object.assign({},DEF,{name:S.name,nameEn:S.nameEn,rate:S.rate});save();renderStars();m.remove()};
};

renderStars();go('home');
})();
</script>

</body>
</html>
